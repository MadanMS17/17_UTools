<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Base64 Converter Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto space-y-8">
        <div>
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">WebP Base64 Converter Suite</h1>
            <p class="text-gray-600">Compress images to WebP Base64 to prevent crashing, or paste Base64 to view the image.</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 space-y-6">
            <h2 class="text-xl font-semibold text-gray-800 border-b pb-2">1. Image to Base64 (WebP Compressor)</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Image</label>
                    <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition" />
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">WebP Quality: <span id="qualityVal" class="text-indigo-600">0.7</span></label>
                    <input type="range" id="qualitySlider" min="0.1" max="1.0" step="0.1" value="0.7" class="w-full accent-indigo-600">
                    <p class="text-xs text-gray-500 mt-1">Lower value = smaller size, lower quality.</p>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Base64 Output</label>
                    <span id="sizeInfo" class="text-xs font-bold text-teal-600 bg-teal-50 px-2 py-1 rounded hidden">Size: Calculating...</span>
                </div>
                <textarea id="base64Output" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-xs bg-gray-50" placeholder="Compressed WebP Base64 string will appear here..." readonly></textarea>
                <button onclick="copyToClipboard()" class="mt-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-lg transition shadow-sm">
                    Copy Base64
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 space-y-6">
            <h2 class="text-xl font-semibold text-gray-800 border-b pb-2">2. Base64 to Image Renderer</h2>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Paste Base64 String</label>
                <textarea id="base64Input" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono text-xs bg-gray-50 mb-3" placeholder="Paste your Base64 string here (e.g., data:image/webp;base64,UklGR...)"></textarea>
                
                <button onclick="convertToImage()" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-5 rounded-lg transition shadow-sm">
                    Render Image
                </button>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Image Preview</label>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 flex justify-center items-center bg-gray-50 min-h-[250px] relative overflow-hidden">
                    <img id="imagePreview" class="max-w-full max-h-96 hidden rounded shadow-sm object-contain" alt="Rendered Base64 Preview" />
                    <span id="placeholderText" class="text-gray-400 absolute">Image preview will appear here</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- SECTION 1: Image to Base64 Logic ---
        const imageInput = document.getElementById('imageInput');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityVal = document.getElementById('qualityVal');
        const base64Output = document.getElementById('base64Output');
        const sizeInfo = document.getElementById('sizeInfo');

        qualitySlider.addEventListener('input', (e) => {
            qualityVal.innerText = e.target.value;
            if (imageInput.files.length > 0) processImage();
        });

        imageInput.addEventListener('change', processImage);

        function processImage() {
            const file = imageInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Anti-crash: Max width of 1200px
                    const MAX_WIDTH = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.floor((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to WebP
                    const quality = parseFloat(qualitySlider.value);
                    const webpBase64 = canvas.toDataURL('image/webp', quality);

                    // Output
                    base64Output.value = webpBase64;
                    
                    // Calc Size
                    const sizeInKB = Math.round((webpBase64.length * 3 / 4) / 1024);
                    sizeInfo.innerText = `Approx. Size: ${sizeInKB} KB`;
                    sizeInfo.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function copyToClipboard() {
            if (!base64Output.value) {
                alert("Nothing to copy!");
                return;
            }
            base64Output.select();
            document.execCommand('copy');
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        // --- SECTION 2: Base64 to Image Logic ---
        function convertToImage() {
            const base64Input = document.getElementById('base64Input').value.trim();
            const imagePreview = document.getElementById('imagePreview');
            const placeholderText = document.getElementById('placeholderText');

            if (base64Input) {
                // Formatting handler: Catch raw base64 pasted without the data URI scheme
                let finalSrc = base64Input;
                if (!base64Input.startsWith('data:image')) {
                    // Default to WebP/PNG if the user just pasted the raw string
                    finalSrc = 'data:image/webp;base64,' + base64Input;
                }

                imagePreview.src = finalSrc;
                imagePreview.classList.remove('hidden');
                placeholderText.classList.add('hidden');
            } else {
                alert('Please paste a Base64 string first.');
            }
        }
    </script>
</body>
</html>
